<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1467e8">
<title>ときの手帳｜歴史年号</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" sizes="1024x1024" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:#152743;background:#f4f8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#c9fbf3 0,transparent 32%),radial-gradient(circle at 0 18%,#dbe9ff 0,transparent 34%),#f4f8ff;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;border:1.5px solid #d4e1f2;border-radius:15px;background:#fff;color:inherit;min-height:48px;padding:12px 15px;font-weight:750;box-shadow:0 3px 0 #dce6f3}
button:active:not(:disabled){transform:translateY(2px);box-shadow:none}button:disabled{opacity:.45}
header{max-width:760px;margin:auto;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#home{border:0;box-shadow:none;background:none;padding:0;text-align:left;font-size:22px;font-weight:950;color:#164a9d}#home small{display:block;font-size:10px;letter-spacing:.12em;color:#5e708a;margin-top:3px}
main{max-width:700px;margin:auto;padding:10px 18px 64px}.hero{padding:12px 0 20px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:900;color:#2361cf}
h1{font-size:34px;line-height:1.35;letter-spacing:-.045em;margin:10px 0;font-weight:950}h1 em{font-style:normal;color:#1467e8}h2{line-height:1.55}.muted,small{color:#596d88}
.stat{display:flex;justify-content:space-between;align-items:center;background:#174795;color:#fff;border-radius:20px;padding:18px 20px;margin:18px 0 22px;box-shadow:0 9px 24px #17479522}.stat b{font-size:23px}
.modes{display:grid;gap:14px}.mode{display:flex;align-items:center;text-align:left;gap:15px;padding:20px 16px;border-left:5px solid #2365ed}.mode b{font-size:18px;display:block}.mode small{display:block;margin-top:6px;line-height:1.55}.num{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:13px;background:#eaf1ff;color:#2365ed;font-size:25px;font-weight:950}.mode:nth-child(2){border-left-color:#008d88}.mode:nth-child(2) .num{background:#def7f2;color:#007c79}.mode:nth-child(3){border-left-color:#ef7913}.mode:nth-child(3) .num{background:#fff0dc;color:#b85200}.mode:nth-child(4){border-left-color:#8552d3}.mode:nth-child(4) .num{background:#f0e8ff;color:#7540bf}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.quiet{background:#ffffffcc;color:#24466f}.primary{background:linear-gradient(115deg,#176cf2,#2948d4);color:#fff;border-color:#1456cc;box-shadow:0 4px 0 #123c9c;min-height:54px;font-size:17px}.wide{width:100%;margin-top:14px}.back{margin-bottom:12px}
.card{background:#fff;border:1.5px solid #d5e2f4;border-radius:22px;padding:21px;margin:18px 0;box-shadow:0 7px 24px #264e8712}.tag{display:inline-block;background:#e8f1ff;color:#2152a2;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:800}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}label.check{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid #d4e0f2;border-radius:12px;padding:13px;font-size:14px;min-height:50px}label.check:has(input:checked){background:#edf4ff;border-color:#669af0}input[type=checkbox]{width:21px;height:21px;accent-color:#2365ed;flex-shrink:0}
input[type=search],select,#year{width:100%;padding:13px;border:1.5px solid #bfd0e8;border-radius:13px;background:#fff;color:inherit;min-height:50px}#year{font-size:30px;text-align:center;border:2px solid #8eb6f5;background:#f7fbff;color:#13419b;min-height:66px}#year::placeholder{font-size:16px;color:#7085a5}
.choices{display:grid;gap:10px;margin-top:16px}.choices button{text-align:left;line-height:1.55;border-width:2px}.choices button.selected{border-color:#2365ed;background:#ebf2ff;color:#153c82}.order-choice{display:flex;align-items:center;gap:12px;min-height:70px}.badge{font-size:28px;color:#2365ed;flex:0 0 34px;text-align:center}
.session{display:flex;justify-content:space-between;gap:10px;background:#e5efff;color:#164a9c;padding:11px 14px;margin:14px 0;border-radius:12px;font-size:13px}.session b{font-size:18px}
.result{border:2px solid #5acba2;border-left-width:5px;background:#e6faf3;color:#123e36;padding:18px;border-radius:14px;margin-top:20px;position:relative}.result.wrong{background:#fff3e6;border-color:#efae62;color:#6c4019}.result h2{margin:0 0 7px;font-size:28px;color:#087552}.result.wrong h2{color:#9b4b0c}.spark{text-align:center;color:#078963;font-size:23px;letter-spacing:.13em;margin-bottom:7px}.memory{background:#ffffffaa;border-radius:10px;padding:11px;font-weight:650;line-height:1.8}.answer{padding:13px 0;border-bottom:1px solid #cfe1d8}.answer:last-child{border:0}
.memory-card .year{font-size:23px;font-weight:900;color:#2158bd}.memory-box{background:#fff3ce;border-radius:14px;padding:14px}.memory-box p{margin:6px 0;line-height:1.8;font-weight:700}
.table-wrap{overflow:auto;background:#fff;border:1px solid #dce5f1;border-radius:16px;margin-top:16px}table{border-collapse:collapse;width:100%;min-width:580px;font-size:13px}th,td{padding:12px 9px;border-bottom:1px solid #e4eaf2;text-align:left;line-height:1.55}th{background:#e7f0ff}
#notice{position:fixed;bottom:16px;left:5%;width:90%;text-align:center;background:#174795;color:#fff;border-radius:12px;padding:12px;display:none;z-index:9}
@media(max-width:380px){main{padding:8px 12px 50px}h1{font-size:29px}.card{padding:16px}.mode{padding:17px 12px;gap:11px}.mode b{font-size:16px}.session{font-size:12px}}
@media(prefers-reduced-motion:no-preference){.result:not(.wrong){animation:pop .25s ease-out}.spark{animation:spark .45s ease-out}@keyframes pop{from{transform:translateY(7px);opacity:.5}to{transform:none;opacity:1}}@keyframes spark{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}}

/* v4: progress, weak questions, daily record, calendar */
.dashboard{display:grid;gap:14px;margin:18px 0}
.mastery-card{background:linear-gradient(135deg,#154fa8,#176fe8);color:#fff;border:0}
.mastery-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.mastery-big{font-size:38px;font-weight:950;letter-spacing:-.04em}
.progress{height:12px;background:#ffffff38;border-radius:999px;overflow:hidden;margin-top:12px}
.progress>i{display:block;height:100%;background:#fff;border-radius:999px}
.today-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.today-grid div{background:#f5f8fd;border:1px solid #e0e8f3;border-radius:13px;padding:12px}
.today-grid b{display:block;font-size:22px;color:#174795;margin-top:2px}
.era-progress{display:grid;gap:12px}
.era-line{display:grid;grid-template-columns:minmax(70px,1fr) minmax(110px,2fr) 50px;gap:9px;align-items:center;font-size:13px}
.era-line .bar{height:9px;background:#e5edf7;border-radius:999px;overflow:hidden}
.era-line .bar i{display:block;height:100%;background:#3375e6;border-radius:999px}
.weak-btn{border-left:5px solid #e75845}
.weak-btn .num{background:#ffebe8;color:#bd3d2d}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.calendar-head button{min-height:42px;padding:8px 12px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-dow{text-align:center;font-size:11px;color:#71839c;padding:5px 0;font-weight:800}
.cal-day{min-height:58px;padding:6px 3px;border-radius:10px;box-shadow:none;text-align:center;font-size:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px}
.cal-day.empty{visibility:hidden}.cal-day.has{background:#eaf2ff;border-color:#8eb6f5;color:#174795}
.cal-day.today{outline:2px solid #1767e8;outline-offset:1px}
.cal-day b{font-size:11px}.day-detail{margin-top:14px;background:#f5f8fd;border-radius:14px;padding:14px;line-height:1.8}
.retry-note{background:#fff5db;border:1px solid #f1d481;color:#6c5312;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;font-weight:700}
@media(max-width:380px){.era-line{grid-template-columns:72px 1fr 42px}.cal-day{min-height:52px;padding:4px 2px}.today-grid{gap:7px}}


/* listen mode */
.listen-card{background:linear-gradient(145deg,#0f397a,#176fe8);color:white;text-align:center;overflow:hidden}
.listen-event{font-size:22px;font-weight:900;line-height:1.55;margin:14px 0 8px}
.listen-year{font-size:34px;font-weight:950;color:#fff4b0;margin:6px 0}
.listen-memory{background:#ffffff18;border:1px solid #ffffff35;border-radius:16px;padding:16px;margin:14px 0;line-height:1.7;text-align:left}
.listen-memory small{display:block;color:#cfe2ff;font-weight:800;margin-bottom:5px}
.listen-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.listen-controls button{min-height:50px}
.listen-status{font-size:13px;color:#d9e8ff;margin-top:8px}

</style>
</head>
<body>
<header><button id="home">ときの手帳<small>歴史年号トレーニング</small></button><button id="sound" class="quiet">♪ 音 ON</button></header>
<main id="app"><p>問題を読み込んでいます…</p></main><p id="notice"></p>
<script>
"use strict";
const $=s=>document.querySelector(s), app=$("#app"), KEY="toki-history-learned-v2";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseCSV(t){let a=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){let x=t[i];if(x=='"'){if(q&&t[i+1]=='"'){c+='"';i++}else q=!q}else if(x==","&&!q){r.push(c);c=""}else if((x=="\n"||x=="\r")&&!q){if(x=="\r"&&t[i+1]=="\n")i++;r.push(c);if(r.some(v=>v.trim()))a.push(r);r=[];c=""}else c+=x}r.push(c);if(r.some(v=>v.trim()))a.push(r);return a}
let data=[],learned=new Set(),sound=true,mode="",selected=new Set(),pool=[],queue=[],current=null,orderItems=[],order=[],digits="",choice=null,answered=false,qIndex=0,correct=0,streak=0,speaking=null,audioCtx=null;
let weak={},daily={},retryDue=[],sessionMaxStreak=0,calendarCursor=new Date(),weakOnly=false;
let listenRows=[],listenIndex=0,listenActive=false,listenToken=0;
const WEAK_KEY="toki-history-weak-v1", DAILY_KEY="toki-history-daily-v1";
try{
learned=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));
sound=localStorage.getItem("toki-sound")!=="off";
weak=JSON.parse(localStorage.getItem(WEAK_KEY)||"{}");
daily=JSON.parse(localStorage.getItem(DAILY_KEY)||"{}");
}catch{}
const modeNames={input:"できごと → 年代",choice:"年代 → できごと",order:"近いできごとを並べ替え"};
function yearInfo(y){let n=Number((y.match(/\d+/)||[])[0]);return{n,bc:/B\.?C|紀元前/i.test(y),century:y.includes("世紀")}}
function time(y){let t=yearInfo(y);return t.bc?-t.n:t.century?(t.n-1)*100+1:t.n}
function compare(a,b){return time(a.year)-time(b.year)||Number(a.no)-Number(b.no)||a.row-b.row}
function displayYear(y){return /^\d+$/.test(y)?y+"年":y.replace("B.C.","紀元前")+(/^B.C./.test(y)?"年":"")}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function page(h){stopSpeech();app.innerHTML=h;scrollTo(0,0)}
function toast(t){$("#notice").textContent=t;$("#notice").style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>$("#notice").style.display="none",3000)}
function setLearned(id,v){
 let was=learned.has(id);
 v?learned.add(id):learned.delete(id);
 try{localStorage.setItem(KEY,JSON.stringify([...learned]))}catch{}
 if(v&&!was){let r=todayRecord();r.newLearned++;clearWeak(id)}
 snapshotMastery()
}
function localDateKey(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function masteryPct(){return data.length?Math.round(data.filter(d=>learned.has(d.id)).length/data.length*100):0}
function saveWeak(){try{localStorage.setItem(WEAK_KEY,JSON.stringify(weak))}catch{}}
function saveDaily(){try{localStorage.setItem(DAILY_KEY,JSON.stringify(daily))}catch{}}
function todayRecord(){
 let k=localDateKey(),r=daily[k];
 if(!r)r=daily[k]={questions:0,correct:0,maxStreak:0,newLearned:0,startMastery:masteryPct(),endMastery:masteryPct()};
 return r
}
function snapshotMastery(){
 let r=todayRecord();r.endMastery=masteryPct();saveDaily()
}
function markWeak(id){weak[id]=(weak[id]||0)+1;saveWeak()}
function clearWeak(id){delete weak[id];saveWeak()}
function scheduleRetry(id){
 retryDue=retryDue.filter(x=>x.id!==id);
 retryDue.push({id,due:qIndex+3+Math.floor(Math.random()*3)})
}
function recordAnswer(ok){
 let r=todayRecord();r.questions++;if(ok)r.correct++;
 sessionMaxStreak=Math.max(sessionMaxStreak,streak);r.maxStreak=Math.max(r.maxStreak,sessionMaxStreak);
 r.endMastery=masteryPct();saveDaily()
}
function eraStats(){
 return [...new Set(data.map(d=>d.era))].map(era=>{let rows=data.filter(d=>d.era===era),n=rows.filter(d=>learned.has(d.id)).length;return{era,n,total:rows.length,pct:rows.length?Math.round(n/rows.length*100):0}})
}
function stopSpeech(){speaking=null;if("speechSynthesis"in window)speechSynthesis.cancel();document.querySelectorAll("[data-speak]").forEach(b=>b.textContent="▶ 暗記法を読み上げ")}
function speak(id,b){if(speaking===id){stopSpeech();return}stopSpeech();let d=data.find(x=>x.id===id);if(!d?.speech){toast("H欄に読み上げ文がありません");return}let u=new SpeechSynthesisUtterance(d.speech);u.lang="ja-JP";u.rate=.9;speaking=id;b.textContent="■ 読み上げを止める";u.onend=()=>stopSpeech();speechSynthesis.speak(u)}
function beep(ok){if(!sound)return;try{audioCtx||=new(AudioContext||webkitAudioContext)();[...(ok?[660,880]:[240,180])].forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.13;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.1,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.18)})}catch{}}
function soundLabel(){$("#sound").textContent=sound?"♪ 音 ON":"♪ 音 OFF"}
$("#sound").onclick=()=>{sound=!sound;localStorage.setItem("toki-sound",sound?"on":"off");soundLabel()};$("#home").onclick=home;
function home(){
 snapshotMastery();
 let pct=masteryPct(),t=todayRecord(),rate=t.questions?Math.round(t.correct/t.questions*100):0,weakCount=data.filter(d=>weak[d.id]&&!learned.has(d.id)).length;
 page(`<section class="hero"><div class="eyebrow">HISTORY / LEVEL UP</div><h1>ひらめく。覚える。<br><em>歴史がつながる！</em></h1><p class="muted">昨日の自分を、1％ずつ追い越そう。</p></section>
 <button id="listen-mode" class="primary wide" style="margin:8px 0 16px">🎧 聞き流しモード <small style="display:block;font-weight:700;opacity:.85">2回ずつ読み上げ・暗記法を表示</small></button>
 <section class="card mastery-card"><div class="mastery-top"><div><small style="color:#dceaff">全体習熟度</small><div class="mastery-big">${pct}%</div></div><b>${data.filter(d=>learned.has(d.id)).length} / ${data.length}</b></div><div class="progress"><i style="width:${pct}%"></i></div></section>
 <section class="card"><div class="eyebrow">TODAY</div><h2 style="margin:6px 0">今日の記録</h2><div class="today-grid"><div>解いた問題<b>${t.questions}問</b></div><div>正解率<b>${rate}%</b></div><div>最高連続<b>${t.maxStreak}問</b></div><div>習熟度UP<b>${Math.max(0,t.endMastery-t.startMastery)}%</b></div></div></section>
 <div class="modes">${Object.entries(modeNames).map(([k,v],i)=>`<button class="mode" data-mode="${k}"><span class="num">0${i+1}</span><span><b>${v}</b><small>${["iPhoneの数字キーボードで入力","4つの選択肢から選ぶ","古い順にタップして①②③④"][i]}</small></span></button>`).join("")}<button class="mode" id="memory-list"><span class="num">04</span><span><b>暗記法一覧</b><small>時代ごとに語呂合わせを見直す</small></span></button>
 <button class="mode weak-btn" id="weak-mode"><span class="num">🔥</span><span><b>苦手を特訓</b><small>間違えた問題 ${weakCount}問を集中練習</small></span></button></div>
 <section class="card"><div class="eyebrow">MASTERY</div><h2 style="margin:6px 0 14px">時代別の習熟度</h2><div class="era-progress">${eraStats().map(x=>`<div class="era-line"><span>${esc(x.era)}</span><span class="bar"><i style="width:${x.pct}%"></i></span><b>${x.pct}%</b></div>`).join("")}</div></section>
 <button id="calendar" class="primary wide">📅 習熟度カレンダー</button>
 <div class="row" style="margin-top:12px"><button id="all-list">すべての問題</button><button id="learned-list">覚えた問題</button></div><button id="reset-data" class="wide quiet" style="margin-top:12px">⚙ 学習データをリセット</button>`);
 document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;settings()});
 $("#memory-list").onclick=memoryList;$("#all-list").onclick=()=>list(false);$("#learned-list").onclick=()=>list(true);
 $("#calendar").onclick=calendarView;$("#weak-mode").onclick=weakTraining;$("#listen-mode").onclick=listenSettings;$("#reset-data").onclick=resetConfirm
}function resetConfirm(){
 page(`<button id="cancel-reset" class="quiet back">← 戻る</button><section class="card"><div class="eyebrow">RESET</div><h1>学習データをリセットしますか？</h1><p>「覚えた」、苦手問題、今日の記録、習熟度カレンダーがすべて消えます。<br><b>この操作は元に戻せません。</b></p><button id="reset-final" class="primary wide">すべての学習データを消す</button><button id="reset-no" class="wide quiet" style="margin-top:10px">やめる</button></section>`);
 $("#cancel-reset").onclick=$("#reset-no").onclick=home;
 $("#reset-final").onclick=()=>{if(!confirm("本当にすべての学習データを消しますか？\nこの操作は元に戻せません。"))return;learned.clear();weak={};daily={};retryDue=[];try{localStorage.removeItem(KEY);localStorage.removeItem(WEAK_KEY);localStorage.removeItem(DAILY_KEY)}catch{}home();toast("学習データをリセットしました")};
}function weakTraining(){
 weakOnly=true;
 let rows=data.filter(d=>weak[d.id]&&!learned.has(d.id));
 if(!rows.length){toast("今のところ苦手問題はありません 🎉");return}
 mode="choice";selected=new Set(rows.map(d=>d.era));qIndex=correct=streak=sessionMaxStreak=0;retryDue=[];queue=shuffle(rows);current=null;
 nextWeakQuestion()
}
function nextWeakQuestion(){
 let rows=data.filter(d=>weak[d.id]&&!learned.has(d.id));
 if(!rows.length){weakOnly=false;home();toast("苦手問題を全部クリアしました！");return}
 pool=rows;
 let dueIndex=retryDue.findIndex(x=>x.due<=qIndex&&rows.some(d=>d.id===x.id));
 if(dueIndex>=0){let item=retryDue.splice(dueIndex,1)[0];current=rows.find(d=>d.id===item.id)}
 else{queue=queue.filter(d=>rows.some(x=>x.id===d.id));if(!queue.length)queue=shuffle(rows);current=queue.shift()}
 answered=false;choice=null;digits="";order=[];renderQuestion()
}function eligible(){if(mode==="choice")return pool.filter(d=>pool.filter(x=>x.year!==d.year&&x.event!==d.event).length>=3);if(mode==="order")return pool.filter(d=>new Set(pool.map(x=>time(x.year))).size>=2);return pool}
function settings(){weakOnly=false;let eras=[...new Set(data.map(d=>d.era))];if(!selected.size)selected=new Set(eras);page(`<button id="mode-back" class="quiet back">← モード選択に戻る</button><div class="eyebrow">出題範囲</div><h1>${modeNames[mode]}</h1><p class="muted">出題する時代を複数選べます。覚えた問題は自動で除外します。</p><div class="row"><button id="all">すべて選ぶ</button><button id="none">すべて外す</button></div><div class="chips">${eras.map((e,i)=>`<label class="check"><input type="checkbox" data-era="${i}" ${selected.has(e)?"checked":""}>${esc(e)} <small>(${data.filter(d=>d.era===e).length})</small></label>`).join("")}</div><p id="count"></p><button id="start" class="primary wide">スタート！</button>`);$("#mode-back").onclick=home;const upd=()=>{pool=data.filter(d=>selected.has(d.era)&&!learned.has(d.id));$("#count").textContent=`現在 ${eligible().length}問が出題可能`;$("#start").disabled=eligible().length<(mode==="order"?2:1)};document.querySelectorAll("[data-era]").forEach(b=>b.onchange=()=>{b.checked?selected.add(eras[b.dataset.era]):selected.delete(eras[b.dataset.era]);upd()});$("#all").onclick=()=>{selected=new Set(eras);document.querySelectorAll("[data-era]").forEach(x=>x.checked=true);upd()};$("#none").onclick=()=>{selected.clear();document.querySelectorAll("[data-era]").forEach(x=>x.checked=false);upd()};$("#start").onclick=()=>{qIndex=correct=streak=sessionMaxStreak=0;retryDue=[];queue=[];current=null;nextQuestion()};upd()}
function nextQuestion(){pool=data.filter(d=>selected.has(d.era)&&!learned.has(d.id));let e=eligible();if(e.length<(mode==="order"?2:1)){page(`<section class="card"><h2>${pool.length?"出題できる問題が足りません":"この範囲は全部覚えました！ 🎉"}</h2><button id="back" class="primary wide">← 範囲を変える</button></section>`);$("#back").onclick=settings;return}let prev=current?.id;
let dueIndex=retryDue.findIndex(x=>x.due<=qIndex&&e.some(d=>d.id===x.id)&&x.id!==prev);
if(dueIndex>=0){let item=retryDue.splice(dueIndex,1)[0];current=e.find(d=>d.id===item.id)}
else{queue=queue.filter(d=>e.some(x=>x.id===d.id));if(!queue.length)queue=shuffle(e);if(queue.length>1&&queue[0].id===prev)[queue[0],queue[1]]=[queue[1],queue[0]];current=queue.shift()}answered=false;choice=null;digits="";order=[];if(mode==="order"){let sorted=[...pool].sort(compare),unique=[];for(let d of sorted){if(!unique.some(x=>time(x.year)===time(d.year)))unique.push(d)}let anchor=unique.findIndex(d=>time(d.year)===time(current.year));if(anchor<0)anchor=0;let n=Math.min(4,unique.length),start=Math.max(0,Math.min(unique.length-n,anchor-Math.floor(Math.random()*n)));let correctOrder=unique.slice(start,start+n);orderItems=shuffle(correctOrder);if(orderItems.length>1&&orderItems.every((x,i)=>x===correctOrder[i]))orderItems.reverse()}renderQuestion()}
function renderQuestion(){page(`<button id="back" class="quiet back">← 戻る・範囲を変える</button><div class="session"><span>⚡ <b>${streak}</b> 連続正解</span><span>★ 正解 <b>${correct}</b></span></div><div class="eyebrow">${modeNames[mode]}　${qIndex+1}問目</div><section class="card"><span class="tag">${mode==="order"?"古い → 新しい":esc(current.era)}</span><h2>${mode==="input"?esc(current.event):mode==="choice"?esc(displayYear(current.year))+"のできごとは？":"古い順にタップしよう"}</h2><div id="body"></div><button id="check" class="primary wide" ${mode==="input"?"":"disabled"}>答え合わせ</button><div id="feedback"></div></section>`);$("#back").onclick=settings;if(mode==="input"){let t=yearInfo(current.year);$("#body").innerHTML=`<label for="year" class="muted">${t.bc?"紀元前の年を入力":t.century?"何世紀？ 数字を入力":"西暦を入力"}</label><input id="year" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" maxlength="4" placeholder="ここをタップして入力">`;$("#year").oninput=e=>{digits=e.target.value.normalize("NFKC").replace(/\D/g,"").slice(0,4);e.target.value=digits};$("#year").onkeydown=e=>{if(e.key==="Enter")check()}}else if(mode==="choice"){let ds=pool.filter(x=>x.year!==current.year&&x.event!==current.event),opts=shuffle([current,...shuffle(ds).slice(0,3)]);$("#body").innerHTML=`<div class="choices">${opts.map(d=>`<button data-opt="${esc(d.id)}">${esc(d.event)}</button>`).join("")}</div>`;document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{choice=b.dataset.opt;document.querySelectorAll("[data-opt]").forEach(x=>x.classList.toggle("selected",x===b));$("#check").disabled=false})}else renderOrder();$("#check").onclick=check}
function renderOrder(){$("#body").innerHTML=`<p class="muted">タップした順に①②③④。もう一度タップすると取り消せます。</p><div class="choices">${orderItems.map(d=>{let i=order.indexOf(d.id);return `<button class="order-choice ${i>=0?"selected":""}" data-order="${esc(d.id)}"><span class="badge">${i>=0?["①","②","③","④"][i]:"○"}</span><span>${esc(d.event)}</span></button>`}).join("")}</div>`;document.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>{let i=order.indexOf(b.dataset.order);i>=0?order.splice(i,1):order.push(b.dataset.order);renderOrder()});$("#check").disabled=order.length!==orderItems.length}
function answerCard(d,rank=""){return `<div class="answer"><b>${rank}${esc(displayYear(d.year))}${mode==="order"?"":` <small>No.${esc(d.no)}</small>`}</b><p>${esc(d.event)}</p><div class="memory">${esc(d.memory||"暗記法は未登録です。")}</div>${mode!=="order"?`<button class="wide quiet" data-speak="${esc(d.id)}">▶ 暗記法を読み上げ</button><label class="check" style="margin-top:12px"><input type="checkbox" data-learn="${esc(d.id)}" ${learned.has(d.id)?"checked":""}>この問題を覚えた</label>`:""}</div>`}
function bind(){document.querySelectorAll("[data-learn]").forEach(b=>b.onchange=()=>setLearned(b.dataset.learn,b.checked));document.querySelectorAll("[data-speak]").forEach(b=>b.onclick=()=>speak(b.dataset.speak,b))}
function check(){if(answered)return;let ok;if(mode==="input")ok=Number(digits)===yearInfo(current.year).n;else if(mode==="choice")ok=choice===current.id;else ok=[...orderItems].sort(compare).every((x,i)=>x.id===order[i]);answered=true;$("#year")?.blur();correct+=ok?1:0;streak=ok?streak+1:0;
if(!ok){markWeak(current.id);scheduleRetry(current.id)}
else if(weak[current.id]&&streak>=1){weak[current.id]=Math.max(0,(weak[current.id]||1)-1);if(!weak[current.id])delete weak[current.id];saveWeak()}
recordAnswer(ok);beep(ok);$("#check").hidden=true;document.querySelectorAll("#body button,#body input").forEach(x=>x.disabled=true);let ans=mode==="order"?[...orderItems].sort(compare):[current];$("#feedback").innerHTML=`<div class="result ${ok?"":"wrong"}">${ok?'<div class="spark">✦　✧　★　✧　✦</div>':""}<h2>${ok?"○ 正解！":"× おしい！"}</h2><p>${ok?(streak>=2?`⚡ ${streak}連続正解！ いいリズム！`:"ナイス！ 知識をひとつチャージ！"):mode==="input"&&!digits?"わからなくてもOK。答えを見て覚えよう！":"ここで覚えれば、一歩前進！"}</p>${mode==="order"?"<p>正しい順番 ↓</p>":""}${ans.map((d,i)=>answerCard(d,mode==="order"?`${i+1}. `:"")).join("")}</div><button id="next" class="primary wide">次の問題 →</button>`;bind();if(mode==="input"){let b=document.querySelector(`[data-speak="${CSS.escape(current.id)}"]`);if(b)setTimeout(()=>speak(current.id,b),180)}$("#next").onclick=()=>{qIndex++;weakOnly?nextWeakQuestion():nextQuestion()}}

function stopListen(goHome=false){
 listenActive=false;listenToken++;
 try{speechSynthesis.cancel()}catch{}
 if(goHome)home()
}
function listenSettings(){
 stopListen(false);
 let eras=[...new Set(data.map(d=>d.era))];
 page(`<button id="back" class="quiet back">← 戻る</button><div class="eyebrow">LISTEN & LEARN</div><h1>🎧 聞き流しモード</h1><p class="muted">選んだ時代をランダムに、1項目につき2回ずつ読み上げます。</p><section class="card"><h2>読み上げる時代</h2><div class="checks">${eras.map(e=>`<label><input type="checkbox" value="${esc(e)}" checked> ${esc(e)}</label>`).join("")}</div><div class="row"><button id="none">すべて外す</button><button id="all">すべて選ぶ</button></div><button id="listen-start" class="primary wide" style="margin-top:14px">▶ 聞き流しスタート</button></section>`);
 $("#back").onclick=home;
 $("#none").onclick=()=>document.querySelectorAll('.checks input').forEach(x=>x.checked=false);
 $("#all").onclick=()=>document.querySelectorAll('.checks input').forEach(x=>x.checked=true);
 $("#listen-start").onclick=()=>{
   let sel=[...document.querySelectorAll('.checks input:checked')].map(x=>x.value);
   if(!sel.length){toast("時代を1つ以上選んでください");return}
   listenRows=shuffle(data.filter(d=>sel.includes(d.era)&&d.speech));
   if(!listenRows.length){toast("読み上げデータがありません");return}
   listenIndex=0;listenActive=true;listenToken++;renderListen();playListenCurrent()
 }
}
function renderListen(){
 let d=listenRows[listenIndex];if(!d)return;
 page(`<button id="listen-back" class="quiet back">← 終了</button><div class="eyebrow">LISTEN & LEARN</div><h1>🎧 聞き流し中</h1>
 <section class="card listen-card"><div class="listen-status">${listenIndex+1} / ${listenRows.length}　・　${esc(d.era)}</div><div class="listen-event">${esc(d.event)}</div><div class="listen-year">${esc(d.date)}</div><div class="listen-memory"><small>暗記法</small>${esc(d.mnemonic||"暗記法は未登録です。")}</div></section>
 <div class="listen-controls"><button id="listen-stop">■ ストップ</button><button id="listen-skip" class="primary">≫ 早送り</button></div>`);
 $("#listen-back").onclick=()=>stopListen(true);
 $("#listen-stop").onclick=()=>{stopListen(false);$("#listen-stop").textContent="停止しました";$("#listen-stop").disabled=true};
 $("#listen-skip").onclick=()=>{if(!listenActive)return;listenToken++;try{speechSynthesis.cancel()}catch{};advanceListen()}
}
function speakPromise(text,token){
 return new Promise(resolve=>{
   if(!listenActive||token!==listenToken){resolve();return}
   if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){resolve();return}
   let u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=.88;
   u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)
 })
}
async function playListenCurrent(){
 let token=listenToken,d=listenRows[listenIndex];if(!d||!listenActive)return;
 await speakPromise(d.speech,token);
 if(!listenActive||token!==listenToken)return;
 await new Promise(r=>setTimeout(r,650));
 if(!listenActive||token!==listenToken)return;
 await speakPromise(d.speech,token);
 if(!listenActive||token!==listenToken)return;
 await new Promise(r=>setTimeout(r,900));
 if(listenActive&&token===listenToken)advanceListen()
}
function advanceListen(){
 if(!listenActive)return;
 listenIndex++;
 if(listenIndex>=listenRows.length){listenRows=shuffle(listenRows);listenIndex=0}
 listenToken++;renderListen();playListenCurrent()
}
function calendarView(){
 let now=new Date(), y=calendarCursor.getFullYear(),m=calendarCursor.getMonth();
 page(`<button id="back" class="quiet back">← 戻る</button><div class="eyebrow">PROGRESS CALENDAR</div><h1>習熟度カレンダー</h1><p class="muted">その日の最後の全体習熟度を自動で保存します。</p><section class="card"><div class="calendar-head"><button id="prev">‹</button><b>${y}年 ${m+1}月</b><button id="nextm">›</button></div><div class="calendar-grid" id="cal"></div><div id="day-detail"></div></section>`);
 $("#back").onclick=home;$("#prev").onclick=()=>{calendarCursor=new Date(y,m-1,1);calendarView()};$("#nextm").onclick=()=>{calendarCursor=new Date(y,m+1,1);calendarView()};
 let grid=$("#cal"),dows=["日","月","火","水","木","金","土"],html=dows.map(x=>`<div class="cal-dow">${x}</div>`).join("");
 let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++)html+='<div class="cal-day empty"></div>';
 for(let d=1;d<=days;d++){let k=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,r=daily[k],isToday=k===localDateKey();html+=`<button class="cal-day ${r?"has":""} ${isToday?"today":""}" data-day="${k}"><span>${d}</span>${r?`<b>${r.endMastery}%</b>`:""}</button>`}
 grid.innerHTML=html;document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>showDay(b.dataset.day))
}
function showDay(k){
 let r=daily[k],box=$("#day-detail");if(!r){box.innerHTML='<div class="day-detail">この日の学習記録はありません。</div>';return}
 let rate=r.questions?Math.round(r.correct/r.questions*100):0,up=r.endMastery-r.startMastery;
 box.innerHTML=`<div class="day-detail"><b>${k.replaceAll("-","/")}</b><br>📚 ${r.questions}問　○ 正解 ${r.correct}問（${rate}%）<br>⚡ 最高 ${r.maxStreak}連続　✓ 新しく覚えた ${r.newLearned}問<br>🎯 全体習熟度 ${r.startMastery}% → <b>${r.endMastery}%</b>（${up>=0?"+":""}${up}%）</div>`
}
function memoryList(){let eras=[...new Set(data.map(d=>d.era))];page(`<button id="back" class="quiet back">← 戻る</button><div class="eyebrow">04 / 暗記法一覧</div><h1>語呂で、思い出そう。</h1><select id="era">${eras.map(e=>`<option>${esc(e)}</option>`).join("")}</select><input id="search" type="search" placeholder="年代・できごと・暗記法で検索" style="margin-top:10px"><p id="mc" class="muted"></p><div id="mem"></div>`);$("#back").onclick=home;function upd(){let q=$("#search").value.normalize("NFKC").toLowerCase(),era=$("#era").value,rows=data.filter(d=>d.era===era&&[d.year,d.event,d.memory].join(" ").normalize("NFKC").toLowerCase().includes(q)).sort(compare);$("#mc").textContent=`${era}：${rows.length}件`;$("#mem").innerHTML=rows.map(d=>`<section class="card memory-card"><div class="year">${esc(displayYear(d.year))}</div><h2>${esc(d.event)}</h2><div class="memory-box"><small>暗記法</small><p>${esc(d.memory||"暗記法は未登録です。")}</p></div><button class="wide quiet" data-speak="${esc(d.id)}">▶ 暗記法を読み上げ</button><label class="check" style="margin-top:12px"><input type="checkbox" data-learn="${esc(d.id)}" ${learned.has(d.id)?"checked":""}>この問題を覚えた</label></section>`).join("");bind()}$("#era").onchange=upd;$("#search").oninput=upd;upd()}
function list(only){page(`<button id="back" class="quiet back">← 戻る</button><h1>${only?"覚えた問題":"問題一覧"}</h1><input id="search" type="search" placeholder="年号・できごと・暗記法で検索"><p id="lc"></p><div id="list"></div>`);$("#back").onclick=home;function upd(){let q=$("#search").value.normalize("NFKC").toLowerCase(),rows=data.filter(d=>(!only||learned.has(d.id))&&[d.year,d.era,d.event,d.memory].join(" ").normalize("NFKC").toLowerCase().includes(q));$("#lc").textContent=`${rows.length}件`;$("#list").innerHTML=`<div class="table-wrap"><table><tr><th>覚えた</th><th>年代</th><th>時代</th><th>できごと</th><th>暗記法</th></tr>${rows.map(d=>`<tr><td><input type="checkbox" data-learn="${esc(d.id)}" ${learned.has(d.id)?"checked":""}></td><td>${esc(displayYear(d.year))}</td><td>${esc(d.era)}</td><td>${esc(d.event)}</td><td>${esc(d.memory)}</td></tr>`).join("")}</table></div>`;document.querySelectorAll("[data-learn]").forEach(b=>b.onchange=()=>{setLearned(b.dataset.learn,b.checked);if(only)upd()})}$("#search").oninput=upd;upd()}
async function init(){try{let r=await fetch("history.csv",{cache:"no-store"});if(!r.ok)throw 0;let rows=parseCSV(await r.text());data=rows.slice(1).filter(r=>r[1]?.trim()&&r[5]?.trim()).map((r,i)=>({id:JSON.stringify([r[0],r[1],r[5]]),row:i,no:r[0],year:r[1].trim(),era:r[2]?.trim()||"時代未設定",event:r[5],memory:r[6]||"",speech:r[7]||""}));soundLabel();home()}catch{page('<section class="card"><h2>history.csvを読み込めませんでした</h2><p>index.htmlとhistory.csvを同じ場所に置いてください。</p></section>')}}
init();
</script>
