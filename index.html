<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9eee8">
  <meta name="description" content="できごとと年代を、歴史ねこと一緒に覚える学習アプリ">
  <title>歴史ねこ探検隊</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f6c7bd'/%3E%3Cpath d='M14 27 18 13l11 8h7l11-8 4 14v16c0 10-8 15-19 15S13 53 13 43Z' fill='%23fff9f3' stroke='%236c5147' stroke-width='3'/%3E%3Ccircle cx='25' cy='36' r='2.5' fill='%236c5147'/%3E%3Ccircle cx='40' cy='36' r='2.5' fill='%236c5147'/%3E%3Cpath d='M29 43q3 3 6 0' fill='none' stroke='%236c5147' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading" class="loading">歴史ねこが準備中…</div>
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="ホームへ戻る">
        <span class="brand-mark">🐾</span>
        <span><strong>歴史ねこ探検隊</strong><small>年代をたどって、歴史の旅へ！</small></span>
      </button>
      <button id="soundButton" class="icon-button" aria-label="音の設定">🔊</button>
    </header>

    <main id="screen"></main>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <button data-go="home" class="active"><span>⌂</span>ホーム</button>
      <button data-go="list"><span>☰</span>年代リスト</button>
      <button data-go="learned"><span>✓</span>覚えた</button>
    </nav>
  </div>

  <dialog id="settingsDialog" class="settings-dialog">
    <form method="dialog">
      <div class="dialog-title"><strong>音の設定</strong><button class="close-button" value="cancel" aria-label="閉じる">×</button></div>
      <label class="switch-row"><span><b>効果音</b><small>正解・不正解の音</small></span><input id="effectToggle" type="checkbox" checked></label>
      <label class="switch-row"><span><b>読み上げ</b><small>答え合わせで暗記法を読む</small></span><input id="speechToggle" type="checkbox" checked></label>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
