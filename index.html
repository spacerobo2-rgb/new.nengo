  <style>
:root {
  --ink: #5e4a43;
  --muted: #8e7a72;
  --paper: #fffdf9;
  --cream: #fff5df;
  --pink: #f5c8bf;
  --pink-deep: #d98579;
  --blue: #c7dce4;
  --blue-deep: #668c9c;
  --yellow: #f5d990;
  --green: #bcd8c4;
  --line: #eadbd3;
  --shadow: 0 8px 24px rgba(103, 75, 64, .10);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: #f7eee9; color: var(--ink); font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif; }
body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% 8%, #fff8e9 0 90px, transparent 91px), radial-gradient(circle at 92% 22%, #f8dcd8 0 75px, transparent 76px), #fbf7f2; }
button, input, select { font: inherit; }
button { color: inherit; }
.loading { min-height: 100vh; display: grid; place-items: center; font-weight: 700; }
.loading-paw { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: #f5c8bf; font-size: 1.5rem; animation: pawPulse .8s ease-in-out infinite alternate; }
@keyframes pawPulse { to { transform: scale(1.08); opacity: .65; } }
.app { width: min(100%, 720px); min-height: 100vh; margin: auto; background: rgba(255,255,255,.58); box-shadow: 0 0 40px rgba(94,74,67,.08); padding-bottom: 88px; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 16px 10px; background: rgba(255,253,249,.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(234,219,211,.8); }
.brand { display: flex; align-items: center; gap: 9px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--pink); font-size: 20px; }
.brand strong, .brand small { display: block; }
.brand strong { font-size: 1rem; letter-spacing: .03em; }
.brand small { margin-top: 1px; color: var(--muted); font-size: .7rem; }
.icon-button, .close-button { width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 50%; background: #fff; cursor: pointer; }
#screen { padding: 18px 16px 30px; }
.hero { position: relative; overflow: hidden; display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; min-height: 184px; padding: 22px; border: 2px solid #f0d5cb; border-radius: 28px; background: linear-gradient(135deg, #fff9ee, #fdeae7); box-shadow: var(--shadow); }
.hero h1 { margin: 0 0 8px; font-size: clamp(1.45rem, 5vw, 2rem); line-height: 1.35; }
.hero p { margin: 0; font-size: .9rem; line-height: 1.65; color: var(--muted); }
.hero img { width: 165%; max-width: none; transform: translateX(-18%); mix-blend-mode: multiply; }
.progress-card { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin: 16px 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 19px; background: var(--paper); }
.progress-ring { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: var(--green); font-weight: 800; }
.progress-card b, .progress-card small { display: block; }
.progress-card small { color: var(--muted); margin-top: 2px; }
.progress-bar { height: 7px; border-radius: 99px; background: #eee5df; overflow: hidden; }
.progress-bar i { display: block; height: 100%; background: var(--pink-deep); border-radius: inherit; }
.section-title { display: flex; align-items: end; justify-content: space-between; gap: 10px; margin: 24px 2px 12px; }
.section-title h2 { margin: 0; font-size: 1.1rem; }
.section-title small { color: var(--muted); }
.era-picker { margin: 14px 0 18px; padding: 14px 15px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); }
.era-picker label { display: block; margin-bottom: 7px; font-size: .84rem; font-weight: 800; color: var(--muted); }
.era-picker select { width: 100%; min-height: 48px; padding: 10px 13px; border: 2px solid #eadbd3; border-radius: 14px; background: #fff; color: var(--ink); font-weight: 800; }
.era-check-panel { padding: 16px; border: 1px solid var(--line); border-radius: 22px; background: var(--paper); box-shadow: var(--shadow); }
.era-check-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.era-check-tools .secondary { min-height: 44px; padding: 8px 10px; }
.era-check-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.era-check { display: flex; align-items: center; gap: 9px; min-height: 62px; padding: 10px; border: 2px solid var(--line); border-radius: 15px; background: white; cursor: pointer; }
.era-check:has(input:checked) { border-color: var(--pink-deep); background: #fff1ee; }
.era-check input { width: 21px; height: 21px; flex: none; accent-color: var(--pink-deep); }
.era-check b, .era-check small { display: block; }
.era-check b { font-size: .92rem; }
.era-check small { margin-top: 3px; color: var(--muted); font-size: .75rem; }
.mode-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.mode-card { min-height: 134px; padding: 16px; border: 1px solid var(--line); border-radius: 22px; background: var(--paper); box-shadow: 0 5px 14px rgba(103,75,64,.06); text-align: left; cursor: pointer; transition: transform .16s, box-shadow .16s; }
.mode-card:active { transform: scale(.98); }
.mode-card.wide { grid-column: 1 / -1; min-height: 90px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; }
.mode-icon { width: 48px; height: 48px; display: grid; place-items: center; margin-bottom: 11px; border-radius: 17px; background: var(--cream); font-size: 1.5rem; }
.mode-card:nth-child(2) .mode-icon { background: #e6f0f4; }
.mode-card:nth-child(3) .mode-icon { background: #f8e2dd; }
.mode-card b, .mode-card small { display: block; }
.mode-card b { font-size: 1rem; }
.mode-card small { margin-top: 5px; line-height: 1.45; color: var(--muted); }
.mode-card.wide .mode-icon { margin: 0; }
.arrow { font-size: 1.35rem; color: var(--pink-deep); }
.page-head { display: flex; align-items: center; gap: 10px; margin-bottom: 17px; }
.back { flex: none; width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 50%; background: white; cursor: pointer; }
.page-head h1 { margin: 0; font-size: 1.25rem; }
.page-head small { display: block; color: var(--muted); margin-top: 2px; }
.question-card { padding: 22px 18px; border: 2px solid #edd8ce; border-radius: 25px; background: var(--paper); box-shadow: var(--shadow); }
.question-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 18px; }
.count { font-size: .84rem; color: var(--muted); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { padding: 4px 9px; border-radius: 99px; background: #f2eae5; font-size: .72rem; font-weight: 700; }
.badge.exam { background: #f9ddd8; color: #9b5148; }
.prompt-label { margin: 0 0 8px; color: var(--muted); font-size: .82rem; font-weight: 700; }
.event-text { margin: 0 0 20px; font-size: clamp(1.2rem, 5vw, 1.55rem); line-height: 1.55; font-weight: 800; }
.year-display { margin: 6px 0 20px; font-size: 2.2rem; font-weight: 900; color: var(--pink-deep); }
.answer-row { display: flex; align-items: center; gap: 8px; }
.year-input { width: 100%; min-width: 0; padding: 15px; border: 2px solid var(--line); border-radius: 16px; background: white; font-size: 1.2rem; outline: none; }
.year-input:focus { border-color: var(--pink-deep); }
.primary, .secondary { min-height: 52px; padding: 12px 18px; border-radius: 16px; font-weight: 800; cursor: pointer; }
.primary { border: 0; background: var(--pink-deep); color: white; box-shadow: 0 5px 0 #b8665c; }
.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8665c; }
.primary:disabled { opacity: .45; box-shadow: none; }
.secondary { border: 1px solid var(--line); background: white; }
.full { width: 100%; margin-top: 14px; }
.choices { display: grid; gap: 10px; }
.choice { width: 100%; min-height: 64px; padding: 13px 15px; border: 2px solid var(--line); border-radius: 17px; background: white; text-align: left; line-height: 1.5; cursor: pointer; }
.choice.selected { border-color: var(--pink-deep); background: #fff1ee; }
.choice.correct { border-color: #72a980; background: #eaf6ed; }
.choice.wrong { border-color: #d4776a; background: #fce8e5; }
.result { margin-top: 16px; padding: 17px; border-radius: 20px; background: #fff5e7; border: 1px solid #eed8b6; }
.result.correct { background: #edf8ef; border-color: #bad8c0; }
.result.wrong { background: #fff0ed; border-color: #efc3bb; }
.result-title { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 1.15rem; font-weight: 900; }
.result p { margin: 7px 0; line-height: 1.55; }
.mnemonic { padding: 12px; border-radius: 14px; background: rgba(255,255,255,.75); }
.result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
.result-actions.single { grid-template-columns: 1fr; }
.learn-check { display: flex; align-items: center; gap: 9px; padding: 11px 0 2px; font-weight: 700; }
.learn-check input { width: 21px; height: 21px; accent-color: var(--pink-deep); }
.sort-help { margin: -4px 0 14px; color: var(--muted); font-size: .9rem; line-height: 1.55; }
.sort-list { display: grid; gap: 10px; }
.sort-card { position: relative; width: 100%; min-height: 72px; padding: 14px 14px 14px 54px; border: 2px solid var(--line); border-radius: 17px; background: white; text-align: left; line-height: 1.45; cursor: pointer; }
.sort-card .order { position: absolute; left: 12px; top: 50%; width: 30px; height: 30px; display: grid; place-items: center; transform: translateY(-50%); border-radius: 50%; background: #eee8e3; font-weight: 900; }
.sort-card.selected { border-color: var(--blue-deep); background: #eff7fa; }
.sort-card.selected .order { background: var(--blue-deep); color: white; }
.correct-order { display: grid; gap: 8px; margin: 12px 0; }
.correct-order div { padding: 9px 11px; border-radius: 12px; background: rgba(255,255,255,.78); line-height: 1.4; }
.correct-order b { color: var(--pink-deep); }
.tools { display: grid; grid-template-columns: 1fr auto; gap: 9px; margin-bottom: 12px; }
.search { width: 100%; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: white; }
.filter-select { padding: 11px; border: 1px solid var(--line); border-radius: 14px; background: white; }
.list-stats { margin: 4px 2px 12px; color: var(--muted); font-size: .83rem; }
.timeline { display: grid; gap: 10px; }
.timeline-item { position: relative; display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: start; padding: 14px 12px; border: 1px solid var(--line); border-radius: 17px; background: var(--paper); }
.timeline-year { color: var(--pink-deep); font-weight: 900; word-break: keep-all; }
.timeline-event { line-height: 1.45; font-weight: 650; }
.timeline-meta { grid-column: 2 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
.mini-check { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; background: white; cursor: pointer; }
.mini-check.done { background: var(--green); border-color: #8fbd99; }
.empty { padding: 45px 20px; text-align: center; color: var(--muted); }
.empty .face { display: block; margin-bottom: 9px; font-size: 2.4rem; }
.bottom-nav { position: fixed; z-index: 25; bottom: 0; left: 50%; width: min(100%, 720px); display: grid; grid-template-columns: repeat(3, 1fr); transform: translateX(-50%); padding: 7px 8px max(7px, env(safe-area-inset-bottom)); background: rgba(255,253,249,.96); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.bottom-nav button { min-height: 55px; border: 0; border-radius: 15px; background: none; color: var(--muted); font-size: .72rem; font-weight: 700; cursor: pointer; }
.bottom-nav button span { display: block; margin-bottom: 2px; font-size: 1.25rem; }
.bottom-nav button.active { background: #f9e4df; color: var(--ink); }
.settings-dialog { width: min(calc(100% - 32px), 420px); padding: 20px; border: 0; border-radius: 24px; color: var(--ink); box-shadow: 0 24px 70px rgba(66,45,38,.28); }
.settings-dialog::backdrop { background: rgba(55,39,34,.34); backdrop-filter: blur(2px); }
.dialog-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 1.15rem; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 14px 2px; border-top: 1px solid var(--line); }
.switch-row b, .switch-row small { display: block; }
.switch-row small { margin-top: 3px; color: var(--muted); }
.switch-row input { width: 24px; height: 24px; accent-color: var(--pink-deep); }
@media (max-width: 420px) {
  .hero { grid-template-columns: 1.15fr .85fr; min-height: 166px; padding: 18px; }
  .hero img { width: 190%; transform: translateX(-27%); }
  .hero p { font-size: .8rem; }
  .mode-card { min-height: 128px; padding: 14px; }
  .timeline-item { grid-template-columns: 66px 1fr auto; }
  .era-check-grid { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

</style>

<script>
(()=>{
const state = {
  data: [], screen: 'home', current: null, choices: [], answered: false,
  questionNo: 1, sortCards: [], sortOrder: [],
  learned: new Set(JSON.parse(localStorage.getItem('historyCatLearned') || '[]').map(String)),
  selectedEras: (() => { try { return JSON.parse(localStorage.getItem('historyCatEras') || '[]'); } catch { return []; } })(),
  effects: localStorage.getItem('historyCatEffects') !== 'false',
  speech: localStorage.getItem('historyCatSpeech') !== 'false'
};

const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => [...root.querySelectorAll(s)];
const screen = $('#screen');

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = []; let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (c === '"' && quoted && next === '"') { field += '"'; i++; }
    else if (c === '"') quoted = !quoted;
    else if (c === ',' && !quoted) { row.push(field); field = ''; }
    else if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && next === '\n') i++;
      row.push(field); field = '';
      if (row.some(v => v !== '')) rows.push(row);
      row = [];
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  const rawHeaders = rows.shift().map(h => h.trim());
  const seen = {};
  const headers = rawHeaders.map(h => {
    seen[h] = (seen[h] || 0) + 1;
    if (h === '暗記法' && seen[h] === 2) return '読み上げ';
    return seen[h] === 1 ? h : `${h}_${seen[h]}`;
  });
  return rows.map((values, index) => {
    const item = Object.fromEntries(headers.map((h, i) => [h, values[i] || '']));
    item.__id = item['番号'].trim() || `row-${index + 1}`;
    return item;
  });
}

function esc(v = '') { return String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { return [...arr].sort(() => Math.random() - .5); }
function saveLearned() { localStorage.setItem('historyCatLearned', JSON.stringify([...state.learned])); }
function itemId(item) { return String(item.__id || item['番号']); }
function toggleLearned(no, force) {
  const key = String(no); const next = force ?? !state.learned.has(key);
  next ? state.learned.add(key) : state.learned.delete(key); saveLearned();
}
function matchesEra(item, era) {
  if (era === '__unclassified') return !item['時代']?.trim();
  return item['時代']?.trim() === era;
}
function inEra(item, eras = state.selectedEras) {
  return !eras.length || eras.some(era => matchesEra(item, era));
}
function eraPool() { return state.data.filter(x => inEra(x)); }
function eraOptions() {
  const values = [...new Set(state.data.map(x => x['時代']?.trim()).filter(Boolean))];
  const options = values.map(v => [v, v]);
  if (state.data.some(x => !x['時代']?.trim())) options.push(['__unclassified', '時代未入力']);
  return options;
}
function eraName() {
  const options = eraOptions();
  if (!state.selectedEras.length || state.selectedEras.length === options.length) return '全時代';
  const names = options.filter(([key]) => state.selectedEras.includes(key)).map(([,label]) => label);
  return names.length <= 2 ? names.join('・') : `${names.length}つの時代`;
}
function unlearnedPool() { const all = eraPool(); const p = all.filter(x => !state.learned.has(itemId(x))); return p.length ? p : all; }
function mnemonicSpeech(item) { return item['読み上げ']?.trim() || item['暗記法'] || ''; }
function badges(item) {
  return `<span class="badge">教 ${esc(item['教'])}</span>${item['入試'] ? `<span class="badge exam">入試 ${esc(item['入試'])}</span>` : ''}`;
}
function yearLabel(value) { return /世紀/.test(value) ? value : `${value}年`; }
function setNav(active) { $$('.bottom-nav button').forEach(b => b.classList.toggle('active', b.dataset.go === active)); }
function go(name) {
  speechSynthesis?.cancel(); state.screen = name; state.answered = false; window.scrollTo({top:0, behavior:'smooth'});
  if (name === 'home') renderHome();
  if (name === 'list') renderList('all');
  if (name === 'learned') renderList('learned');
}

function renderHome() {
  setNav('home'); const learned = state.learned.size; const pct = Math.round(learned / state.data.length * 100);
  screen.innerHTML = `
    <section class="hero"><div><h1>さあ、歴史の旅へ！</h1><p>ねこと一緒に、できごとと年代を少しずつ覚えよう。</p></div><img src="assets/history-cats.png" alt="巻物や地図を持った歴史ねこたち"></section>
    <section class="progress-card"><div class="progress-ring">${pct}%</div><div><b>${learned}／${state.data.length}問 覚えた</b><small>今日も自分のペースで進もう</small></div><div class="progress-bar" aria-label="学習進捗"><i style="width:${pct}%"></i></div></section>
    <div class="section-title"><h2>学習する</h2><small>覚えていない問題から出題</small></div>
    <div class="mode-grid">
      <button class="mode-card" data-mode="eventYear"><span class="mode-icon">📜</span><b>できごと → 年代</b><small>年代を入力して答えよう</small></button>
      <button class="mode-card" data-mode="yearEvent"><span class="mode-icon">⏳</span><b>年代 → できごと</b><small>正しいできごとを4択</small></button>
      <button class="mode-card" data-mode="sort"><span class="mode-icon">↕</span><b>順番に並べる</b><small>古い順に4つをタップ</small></button>
      <button class="mode-card wide" data-mode="list"><span class="mode-icon">📚</span><span><b>年代リスト</b><small>全${state.data.length}件をサーッと確認</small></span><span class="arrow">›</span></button>
    </div>`;
  $$('[data-mode]').forEach(b => b.onclick = () => b.dataset.mode === 'list' ? go('list') : renderEraSelection(b.dataset.mode));
}

function renderEraSelection(mode) {
  setNav(''); window.scrollTo({top:0, behavior:'smooth'});
  const options = eraOptions();
  const valid = state.selectedEras.filter(key => options.some(([optionKey]) => optionKey === key));
  const checked = valid.length ? valid : options.map(([key]) => key);
  const titles = { eventYear:'できごと → 年代', yearEvent:'年代 → できごと', sort:'順番に並べる' };
  screen.innerHTML = questionHead('出題する時代を選ぶ', titles[mode]) + `
    <p class="sort-help">CSVのC列で区分しています。複数選べます。</p>
    <section class="era-check-panel">
      <div class="era-check-tools"><button type="button" id="selectAllEras" class="secondary">すべて選択</button><button type="button" id="clearAllEras" class="secondary">すべて解除</button></div>
      <div class="era-check-grid">${options.map(([key,label])=>`<label class="era-check"><input type="checkbox" value="${esc(key)}" ${checked.includes(key)?'checked':''}><span><b>${esc(label)}</b><small>${state.data.filter(item=>matchesEra(item,key)).length}問</small></span></label>`).join('')}</div>
      <button type="button" id="startSelectedMode" class="primary full">この範囲で始める</button>
    </section>`;
  bindGo();
  const boxes = () => $$('.era-check input');
  const update = () => { $('#startSelectedMode').disabled = !boxes().some(box => box.checked); };
  boxes().forEach(box => box.onchange = update);
  $('#selectAllEras').onclick = () => { boxes().forEach(box => box.checked=true); update(); };
  $('#clearAllEras').onclick = () => { boxes().forEach(box => box.checked=false); update(); };
  $('#startSelectedMode').onclick = () => {
    state.selectedEras = boxes().filter(box => box.checked).map(box => box.value);
    if (!state.selectedEras.length) return;
    localStorage.setItem('historyCatEras', JSON.stringify(state.selectedEras));
    state.screen = mode; state.questionNo = 1; state.answered = false;
    if (mode === 'eventYear') newEventYear();
    if (mode === 'yearEvent') newYearEvent();
    if (mode === 'sort') newSort();
  };
  update();
}

function questionHead(title, subtitle) {
  return `<div class="page-head"><button class="back" data-go="home" aria-label="戻る">‹</button><div><h1>${title}</h1><small>${subtitle}</small></div></div>`;
}
function newEventYear() {
  setNav(''); state.current = randomItem(unlearnedPool()); state.answered = false;
  screen.innerHTML = questionHead('できごと → 年代', `${eraName()}・第${state.questionNo}問`) + `
    <section class="question-card"><div class="question-top"><span class="count">このできごとは何年？</span><span class="badges">${badges(state.current)}</span></div>
    <p class="event-text">${esc(state.current['できごと'])}</p>
    <div class="answer-row"><input id="yearAnswer" class="year-input" inputmode="text" autocomplete="off" placeholder="年代を入力"><button id="checkYear" class="primary">答え合わせ</button></div>
    <div id="resultArea"></div></section>`;
  bindGo(); $('#checkYear').onclick = checkEventYear; $('#yearAnswer').addEventListener('keydown', e => { if (e.key === 'Enter') checkEventYear(); }); $('#yearAnswer').focus();
}
function normalizeYear(v) { return String(v).trim().toUpperCase().replace(/[Ａ-Ｚａ-ｚ０-９．]/g, s => String.fromCharCode(s.charCodeAt(0)-0xFEE0)).replace(/\s/g,'').replace(/紀元前/i,'B.C.'); }
function checkEventYear() {
  if (state.answered) return; const input = normalizeYear($('#yearAnswer').value); if (!input) return;
  state.answered = true; const ok = input === normalizeYear(state.current['年代']); playSound(ok);
  showResult($('#resultArea'), ok, state.current, newEventYear); $('#yearAnswer').disabled = true; $('#checkYear').disabled = true;
}

function newYearEvent() {
  setNav(''); state.current = randomItem(unlearnedPool()); state.answered = false;
  const sameEra = shuffle(eraPool().filter(x => itemId(x) !== itemId(state.current) && x['できごと'] !== state.current['できごと']));
  const fallback = shuffle(state.data.filter(x => itemId(x) !== itemId(state.current) && x['できごと'] !== state.current['できごと'] && !sameEra.some(y => itemId(y) === itemId(x))));
  const others = [...sameEra, ...fallback].slice(0,3);
  state.choices = shuffle([state.current, ...others]);
  screen.innerHTML = questionHead('年代 → できごと', `${eraName()}・第${state.questionNo}問`) + `
    <section class="question-card"><div class="question-top"><span class="count">この年代のできごとは？</span><span class="badges">${badges(state.current)}</span></div>
    <div class="year-display">${esc(yearLabel(state.current['年代']))}</div><div id="eventChoices" class="choices">${state.choices.map(x => `<button type="button" class="choice" data-no="${esc(itemId(x))}">${esc(x['できごと'])}</button>`).join('')}</div>
    <button type="button" id="checkChoice" class="primary full" disabled>できごとを選んでください</button><div id="resultArea"></div></section>`;
  bindGo();
  const checkButton = $('#checkChoice');
  $('#eventChoices').addEventListener('click', event => {
    const choice = event.target.closest('.choice');
    if (!choice || state.answered) return;
    $$('.choice').forEach(button => button.classList.toggle('selected', button === choice));
    checkButton.dataset.selected = choice.dataset.no;
    checkButton.disabled = false;
    checkButton.textContent = '答え合わせ';
  });
  checkButton.addEventListener('click', () => {
    const chosen = checkButton.dataset.selected;
    if (!chosen || state.answered) return;
    state.answered = true;
    const correctId = itemId(state.current);
    const ok = chosen === correctId;
    playSound(ok);
    $$('.choice').forEach(button => button.classList.add(button.dataset.no === correctId ? 'correct' : (button.dataset.no === chosen ? 'wrong' : '')));
    checkButton.disabled = true;
    showResult($('#resultArea'), ok, state.current, newYearEvent);
    $('#resultArea').scrollIntoView({behavior:'smooth', block:'nearest'});
  });
}

function newSort() {
  setNav(''); state.answered = false; state.sortOrder = [];
  const all = eraPool();
  if (all.length < 4) {
    screen.innerHTML = questionHead('順番に並べる', eraName()) + `<div class="empty"><span class="face">ฅ^•ﻌ•^ฅ</span>この時代はまだ${all.length}問です。<br>並べ替えには4問以上必要です。</div><button class="secondary full" data-go="home">時代を選び直す</button>`;
    bindGo(); return;
  }
  const preferred = shuffle(all.filter(x => !state.learned.has(itemId(x))));
  const rest = shuffle(all.filter(x => state.learned.has(itemId(x))));
  const source = [...preferred, ...rest].slice(0,4); state.sortCards = shuffle(source);
  screen.innerHTML = questionHead('順番に並べる', `${eraName()}・4つのできごと`) + `
    <p class="sort-help">古いと思う順にタップしてください。選び直すときは、もう一度タップすると解除できます。</p>
    <section class="question-card"><div class="sort-list">${state.sortCards.map(x=>`<button class="sort-card" data-no="${esc(itemId(x))}"><span class="order">−</span>${esc(x['できごと'])}</button>`).join('')}</div>
    <button id="checkSort" class="primary full" disabled>答え合わせ</button><div id="resultArea"></div></section>`;
  bindGo(); $$('.sort-card').forEach(b => b.onclick = () => selectSort(b)); $('#checkSort').onclick = checkSort;
}
function selectSort(button) {
  if (state.answered) return; const no = button.dataset.no; const index = state.sortOrder.indexOf(no);
  if (index >= 0) state.sortOrder.splice(index, 1); else state.sortOrder.push(no);
  $$('.sort-card').forEach(b => { const i=state.sortOrder.indexOf(b.dataset.no); b.classList.toggle('selected',i>=0); $('.order',b).textContent=i>=0?i+1:'−'; });
  $('#checkSort').disabled = state.sortOrder.length !== 4;
}
function sortKey(x) {
  const value=x['年代']; if (/B\.C\./i.test(value)) return -parseInt(value.replace(/\D/g,''));
  if (/世紀/.test(value)) return parseInt(value)*100-99; return parseInt(value)||0;
}
function checkSort() {
  if (state.answered || state.sortOrder.length !== 4) return; state.answered=true;
  const correct=[...state.sortCards].sort((a,b)=>sortKey(a)-sortKey(b)||(Number(a['番号'])||9999)-(Number(b['番号'])||9999));
  const ok=correct.every((x,i)=>itemId(x)===state.sortOrder[i]); playSound(ok);
  const area=$('#resultArea'); area.innerHTML=`<div class="result ${ok?'correct':'wrong'}"><div class="result-title">${ok?'◎ 正解！':'△ おしい！ 正しい順番はこちら'}</div><div class="correct-order">${correct.map((x,i)=>`<div><b>${i+1}. ${esc(yearLabel(x['年代']))}</b>　${esc(x['できごと'])}<br><small>覚え方：${esc(x['暗記法']||'—')}</small></div>`).join('')}</div><div class="result-actions single"><button id="nextSort" class="primary">次の問題</button></div></div>`;
  $('#nextSort').onclick=()=>{speechSynthesis?.cancel();state.questionNo++;newSort();};
}

function showResult(area, ok, item, nextQuestion) {
  area.innerHTML=`<div class="result ${ok?'correct':'wrong'}"><div class="result-title">${ok?'◎ 正解！':'△ おしい！'}</div><p><b>${esc(yearLabel(item['年代']))}</b>　${esc(item['できごと'])}</p><p class="mnemonic"><b>覚え方</b><br>${esc(item['暗記法']||'—')}</p><label class="learn-check"><input id="learnToggle" type="checkbox" ${state.learned.has(itemId(item))?'checked':''}>この問題は覚えた！</label><div class="result-actions"><button id="speakOne" class="secondary">🔊 暗記法を聞く</button><button id="nextQuestion" class="primary">次の問題</button></div></div>`;
  $('#learnToggle').onchange=e=>toggleLearned(itemId(item),e.target.checked); $('#speakOne').onclick=()=>speak(mnemonicSpeech(item)); $('#nextQuestion').onclick=e=>{e.preventDefault();e.currentTarget.disabled=true;speechSynthesis?.cancel();state.questionNo++;nextQuestion();}; if(state.speech) setTimeout(()=>$('#speakOne')?.click(),250);
}

function renderList(mode='all') {
  setNav(mode==='learned'?'learned':'list'); state.screen=mode==='learned'?'learned':'list';
  screen.innerHTML=questionHead(mode==='learned'?'覚えた問題':'年代リスト', mode==='learned'?'チェックした問題を確認':'全項目をサーッと確認')+`
    <div class="tools"><input id="searchInput" class="search" type="search" placeholder="年代・できごとを検索"><select id="listFilter" class="filter-select" aria-label="表示する問題"><option value="${mode==='learned'?'learned':'all'}">${mode==='learned'?'覚えた':'すべて'}</option><option value="unlearned">まだ覚えていない</option>${mode!=='learned'?'<option value="learned">覚えた</option>':'<option value="all">すべて</option>'}</select></div><div id="listArea"></div>`;
  bindGo(); const update=()=>drawList($('#searchInput').value,$('#listFilter').value); $('#searchInput').oninput=update; $('#listFilter').onchange=update; update();
}
function drawList(query, filter) {
  const q=query.trim().toLowerCase(); let items=state.data.filter(x=>!q||Object.values(x).some(v=>String(v).toLowerCase().includes(q)));
  if(filter==='learned')items=items.filter(x=>state.learned.has(itemId(x))); if(filter==='unlearned')items=items.filter(x=>!state.learned.has(itemId(x)));
  const area=$('#listArea'); if(!items.length){area.innerHTML='<div class="empty"><span class="face">ฅ^•ﻌ•^ฅ</span>該当する問題はありません</div>';return;}
  area.innerHTML=`<div class="list-stats">${items.length}件を表示</div><div class="timeline">${items.map(x=>`<article class="timeline-item"><div class="timeline-year">${esc(yearLabel(x['年代']))}</div><div class="timeline-event">${esc(x['できごと'])}</div><button class="mini-check ${state.learned.has(itemId(x))?'done':''}" data-learn="${esc(itemId(x))}" aria-label="覚えたを切り替える">✓</button><div class="timeline-meta">${x['番号']?`<span class="badge">No.${esc(x['番号'])}</span>`:''}${x['時代']?`<span class="badge">${esc(x['時代'])}</span>`:''}${badges(x)}<span class="badge">覚え方：${esc(x['暗記法']||'—')}</span></div></article>`).join('')}</div>`;
  $$('[data-learn]',area).forEach(b=>b.onclick=()=>{toggleLearned(b.dataset.learn);drawList(query,filter);});
}

function playSound(correct) {
  if(!state.effects)return; const C=window.AudioContext||window.webkitAudioContext; if(!C)return; const ctx=new C(); const now=ctx.currentTime;
  const tone=(freq,start,duration,type='sine')=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now+start);g.gain.setValueAtTime(.0001,now+start);g.gain.exponentialRampToValueAtTime(.16,now+start+.015);g.gain.exponentialRampToValueAtTime(.0001,now+start+duration);o.connect(g).connect(ctx.destination);o.start(now+start);o.stop(now+start+duration+.02);};
  if(correct){tone(660,0,.18);tone(880,.15,.28);}else{tone(260,0,.18,'triangle');tone(196,.16,.3,'triangle');} setTimeout(()=>ctx.close(),700);
}
function speak(text) { if(!('speechSynthesis'in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.9;u.pitch=1.08;speechSynthesis.speak(u); }
function bindGo(){ $$('[data-go]',screen).forEach(b=>b.onclick=()=>go(b.dataset.go)); }

document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b&&!screen.contains(b))go(b.dataset.go);});
$('#soundButton').onclick=()=>$('#settingsDialog').showModal();
$('#effectToggle').checked=state.effects;$('#speechToggle').checked=state.speech;
$('#effectToggle').onchange=e=>{state.effects=e.target.checked;localStorage.setItem('historyCatEffects',state.effects);};
$('#speechToggle').onchange=e=>{state.speech=e.target.checked;localStorage.setItem('historyCatSpeech',state.speech);if(!state.speech)speechSynthesis?.cancel();};

const historyDataPromise = window.__HISTORY_CSV__
  ? Promise.resolve(window.__HISTORY_CSV__)
  : fetch('history.csv?v=5').then(r=>{if(!r.ok)throw new Error();return r.text();});
historyDataPromise.then(text=>{state.data=parseCSV(text);if(!state.data.length)throw new Error();$('#loading').hidden=true;$('#app').hidden=false;renderHome();}).catch(()=>{$('#loading').innerHTML='データを読み込めませんでした。<br>ページを再読み込みしてください。';});

})();
</script>
</body>
</html>
